<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מצגת מונפשת – קרונית על גלגל ענק</title>
<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc;
    --cab:#f97316; --R:#2563eb; --L:#16a34a; --ang:#9333ea; --B:#dc2626; --D:#0891b2;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
  header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 16px;background:#fff;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0}
  header a{color:var(--R);text-decoration:none;font-size:14px}
  .wrap{flex:1;min-height:0;display:flex;gap:10px;padding:10px}
  /* RTL: הילד הראשון (הטקסט) בצד ימין, הסימולטור בצד שמאל */
  .panel{flex:0 0 47%;overflow-y:auto;padding-left:6px;scroll-behavior:smooth}
  .stage{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;align-items:center;justify-content:center}
  svg{width:100%;height:100%;display:block;direction:ltr}
  @media (max-width:700px){body{overflow:auto;display:block}.wrap{flex-direction:column}.panel{flex:none;overflow:visible}.stage{order:-1}}

  .qfull,.qbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;line-height:1.75}
  .qfull{font-size:17px}
  .qbox summary{cursor:pointer;font-weight:700;color:var(--muted)}
  .qfull ol,.qbox ol{margin:6px 0 0;padding-right:22px}
  .hint{color:var(--muted);margin-top:12px}

  ol.items{list-style:none;margin:12px 0 0;padding:0}
  ol.items li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;cursor:pointer}
  ol.items li.new{animation:pop .5s ease both}
  ol.items li.ahead{opacity:.5}
  ol.items li.cur{cursor:default}
  ol.items li.cur{border:2px solid var(--cab);box-shadow:0 4px 14px rgba(249,115,22,.15)}
  ol.items li.done{opacity:.8}
  .chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin-left:8px;background:#e0f2fe;color:#075985}
  .chip.sec{background:#ffedd5;color:#9a3412}
  .chip.type{background:#f3e8ff;color:#6b21a8}
  .qtext{font-size:17px;line-height:1.6}
  .ans{margin-top:6px;color:#166534;font-weight:600}
  .ans span{margin-left:14px}
  .ans span,.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .sol{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  li.new .sol{animation:pop .6s .5s ease both}
  .sol details{margin:6px 0}
  .sol summary{cursor:pointer;font-weight:700;line-height:1.5}
  .math{direction:ltr;text-align:left;font-family:"Cambria Math","Times New Roman",serif;font-size:17px;background:#f8fafc;border-radius:8px;padding:6px 12px;margin-top:4px}
  .math div{padding:2px 0}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* svg */
  .se{transition:opacity .6s}
  .hid{opacity:0}
  .instant .se{transition:none}
  .lbl{font:700 15px "Segoe UI",Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;fill:var(--ink)}
  .gond rect{fill:#e2e8f0;stroke:#64748b;stroke-width:1.5}
  .cab.hl rect{fill:var(--cab);stroke:#9a3412}
  .dash{stroke-dasharray:6 5}

  .bar{flex:none;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;padding:7px;flex-wrap:wrap}
  .bar button{font:inherit;font-size:16px;border:0;border-radius:10px;padding:8px 18px;cursor:pointer;background:#e2e8f0}
  .bar button.main{background:var(--cab);color:#fff;font-weight:700}
  .bar button:disabled{opacity:.4;cursor:default}
  .dots{display:flex;gap:5px}
  .dots i{width:9px;height:9px;border-radius:50%;background:#cbd5e1;cursor:pointer}
  .dots i.on{background:var(--cab)}
</style>
</head>
<body>
<header>
  <h1>🎡 קרונית על גלגל ענק – מצגת מונפשת</h1>
  <a href="index.html#wheel-presentations">→ למצגות תנועה על גלגל</a>
</header>

<div class="wrap">
  <section class="panel" id="panel"></section>
  <section class="stage"><svg id="sv" viewBox="0 0 500 520" aria-label="שרטוט הגלגל"></svg></section>
</div>

<div class="bar">
  <button id="prev">→ הקודם</button>
  <button id="replay">↻ נגן שוב</button>
  <div class="dots" id="dots"></div>
  <span id="cnt" style="color:var(--muted);min-width:50px;text-align:center"></span>
  <button id="next" class="main">הבא ←</button>
</div>

<script>
/* ---------- גאומטריה ---------- */
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('sv');
const CX=250, CY=270, R=160, GY=470;          // 8 פיקסלים = 1 מטר
const P=(th,r=R)=>{const a=th*Math.PI/180;return [CX+r*Math.cos(a), CY-r*Math.sin(a)];};
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e;}
function txt(x,y,s,attrs,parent){const t=el('text',Object.assign({x,y,class:'lbl'},attrs||{}),parent);t.textContent=s;return t;}
function grp(){return el('g',{class:'se hid'});}
function arcD(th1,th2,r=R){const[x1,y1]=P(th1,r),[x2,y2]=P(th2,r);const large=(th1-th2)>180?1:0;return `M${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2}`;}
const line=(x1,y1,x2,y2,a,p)=>el('line',Object.assign({x1,y1,x2,y2},a),p);

/* defs */
const defs=el('defs',{});
[['ar','#334155'],['arO','#f97316'],['arP','#9333ea']].forEach(([id,c])=>{
  const m=el('marker',{id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);
  el('path',{d:'M0 0 L10 5 L0 10 z',fill:c},m);
});

/* קרקע ותמיכות */
el('rect',{x:0,y:GY,width:500,height:50,fill:'#dcfce7'});
line(0,GY,500,GY,{stroke:'#166534','stroke-width':2});
el('path',{d:`M${CX-70} ${GY} L${CX} ${CY} L${CX+70} ${GY}`,fill:'none',stroke:'#94a3b8','stroke-width':7,'stroke-linejoin':'round'});

/* גלגל */
el('circle',{cx:CX,cy:CY,r:R,fill:'none',stroke:'#64748b','stroke-width':4});
el('circle',{cx:CX,cy:CY,r:R-10,fill:'none',stroke:'#cbd5e1','stroke-width':1.5});
const spokes=el('g',{});
for(let k=0;k<8;k++){const[x,y]=P(k*45);line(CX,CY,x,y,{stroke:'#94a3b8','stroke-width':2},spokes);}

/* מסלול שעברה הקרונית, זווית, היקף */
const Lc=el('circle',{cx:CX,cy:CY,r:R,fill:'none',stroke:'var(--L)','stroke-width':7,pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1,class:'se hid',transform:`rotate(180 ${CX} ${CY})`});
const trace=el('path',{d:'',fill:'none',stroke:'var(--cab)','stroke-width':7,'stroke-linecap':'round',opacity:.85});
const gAng=grp();
el('path',{d:`M${CX} ${CY} L${P(180,45)} `+arcD(180,108,45).replace('M','L')+' Z',fill:'rgba(147,51,234,.18)',stroke:'var(--ang)','stroke-width':2},gAng);
line(CX,CY,...P(108),{stroke:'var(--ang)','stroke-width':2},gAng);
txt(...P(144,66),'72°',{fill:'var(--ang)','text-anchor':'middle'},gAng);
const gS=grp();
txt(12,150,"s = 8π ≈ 25.13 מ׳",{fill:'#c2410c'},gS);

el('circle',{cx:CX,cy:CY,r:10,fill:'#475569'});

/* צירים */
const gAxes=grp();
line(20,GY,485,GY,{stroke:'#334155','stroke-width':2,'marker-end':'url(#ar)'},gAxes);
line(CX,GY+20,CX,55,{stroke:'#334155','stroke-width':2,'marker-end':'url(#ar)'},gAxes);
txt(488,GY-8,'x',{},gAxes); txt(CX+8,60,'y',{},gAxes); txt(CX+6,GY+20,'O',{},gAxes);

/* קרוניות */
function makeGond(cls){const g=el('g',{class:cls});line(0,0,0,9,{stroke:'#475569','stroke-width':2},g);el('rect',{x:-12,y:9,width:24,height:17,rx:5},g);el('circle',{cx:0,cy:0,r:3,fill:'#475569'},g);return g;}
const decor=[...Array(7)].map(()=>makeGond('gond'));
const cab=makeGond('gond cab');

/* נתון 1: C וגובה 25 */
const gC=grp();
el('circle',{cx:CX,cy:CY,r:6,fill:'var(--ink)'},gC);
txt(CX+12,CY-10,'C(0, 25)',{},gC);
const gH=grp();
line(CX,CY,455,CY,{stroke:'#334155',class:'dash'},gH);
line(455,CY+3,455,GY-3,{stroke:'#334155','stroke-width':2,'marker-start':'url(#ar)','marker-end':'url(#ar)'},gH);
txt(462,(CY+GY)/2,"25 מ׳",{},gH);

/* נתון 2: רדיוס */
const gR=grp();
line(CX,CY,...P(35),{stroke:'var(--R)','stroke-width':4},gR);
txt(...P(35,R/2).map((v,i)=>v+(i?-12:4)),'R = 20',{fill:'var(--R)'},gR);

/* נתון 3: כיוון וזמן מחזור */
const gDir=grp();
el('path',{d:arcD(155,105,R+28),fill:'none',stroke:'var(--cab)','stroke-width':4,'marker-end':'url(#arO)'},gDir);
txt(12,70,'עם כיוון השעון',{fill:'#c2410c'},gDir);
txt(12,92,'T = 40 שניות',{fill:'#c2410c'},gDir);

/* נתון 4: נקודה A */
const [Ax,Ay]=P(180);
const gA=grp();
line(CX,CY,Ax,Ay,{stroke:'#334155',class:'dash'},gA);
el('circle',{cx:Ax,cy:Ay,r:7,fill:'var(--cab)',stroke:'#fff','stroke-width':2},gA);
txt(Ax-26,Ay+5,'A',{fill:'#c2410c'},gA);

/* סעיף א */
const gAc=grp();
line(Ax,Ay,Ax,GY,{stroke:'#334155',class:'dash'},gAc);
txt(Ax,GY+20,'−20',{'text-anchor':'middle'},gAc);
txt(10,Ay-14,'A(−20, 25)',{fill:'#c2410c'},gAc);
const gTh=grp();
line(CX,CY,CX+75,CY,{stroke:'var(--ang)','stroke-width':2,class:'dash'},gTh);
el('path',{d:`M${CX+38} ${CY} A38 38 0 0 0 ${CX-38} ${CY}`,fill:'none',stroke:'var(--ang)','stroke-width':3,'marker-end':'url(#arP)'},gTh);
{const t=txt(CX,CY-46,'',{fill:'var(--ang)','text-anchor':'middle'},gTh);t.innerHTML='θ<tspan dy="5" font-size="11">A</tspan><tspan dy="-5"> = 180°</tspan>';}

/* סעיף ב */
const gLt=grp(),gV=grp(),gW=grp();
txt(490,30,"L = 40π ≈ 125.66 מ׳",{fill:'var(--L)','text-anchor':'end'},gLt);
txt(490,52,"v = π ≈ 3.14 מ׳ לשנייה",{fill:'var(--L)','text-anchor':'end'},gV);
txt(490,74,"ω = 9° לשנייה",{fill:'var(--L)','text-anchor':'end'},gW);

/* סעיף ד */
const [Bx,By]=P(108);
const gB=grp();
line(CX,CY,Bx,CY,{stroke:'var(--R)','stroke-width':4},gB);
line(Bx,CY,Bx,By,{stroke:'var(--B)','stroke-width':4},gB);
txt((CX+Bx)/2,CY+20,'Δx ≈ 6.18',{fill:'var(--R)','text-anchor':'middle'},gB);
txt(Bx-6,(CY+By)/2,'Δy ≈ 19.02',{fill:'var(--B)','text-anchor':'end'},gB);
const gBp=grp();
line(Bx,CY,Bx,GY,{stroke:'#334155',class:'dash'},gBp);
line(Bx,By,CX,By,{stroke:'#334155',class:'dash'},gBp);
txt(Bx,GY+20,'−6.18',{'text-anchor':'middle'},gBp);
txt(CX+8,By-4,'44.02',{},gBp);
const gBl=grp();
el('circle',{cx:Bx,cy:By,r:7,fill:'var(--B)',stroke:'#fff','stroke-width':2},gBl);
txt(Bx-14,By+5,'B(−6.18, 44.02)',{fill:'var(--B)','text-anchor':'end'},gBl);

/* סעיף ה */
const [Dx,Dy]=P(90);
const gD=grp();
el('circle',{cx:Dx,cy:Dy,r:7,fill:'var(--D)',stroke:'#fff','stroke-width':2},gD);
txt(Dx+16,Dy-22,'D(0, 45)',{fill:'var(--D)'},gD);

/* שעון */
const timer=txt(12,30,'',{class:'lbl se hid',fill:'#c2410c',style:'font-size:20px'});

/* ---------- מצב ---------- */
let theta=180;
function setTheta(th){
  theta=th;
  spokes.setAttribute('transform',`rotate(${180-th} ${CX} ${CY})`);
  const[x,y]=P(th);cab.setAttribute('transform',`translate(${x} ${y})`);
  decor.forEach((g,i)=>{const[a,b]=P(th+45*(i+1));g.setAttribute('transform',`translate(${a} ${b})`);});
}
const show=e=>e.classList.remove('hid');
let token=0;
const wait=(ms,my)=>new Promise(r=>setTimeout(()=>r(my===token),ms));
function tween(dur,f,my){return new Promise(res=>{const t0=performance.now();
  function fr(now){if(my!==token)return res(false);const p=Math.min(1,(now-t0)/dur);f(p);p<1?requestAnimationFrame(fr):res(true);}
  requestAnimationFrame(fr);});}
async function reveal(a,my,...els){for(const e of els){if(a&&!(await wait(500,my)))return false;show(e);}return true;}
const setTimer=t=>{timer.textContent=`t = ${t.toFixed(1)} שניות`;show(timer);};
function moveTo(th1,th2,t1,t2){return p=>{const th=th1+(th2-th1)*p;setTheta(th);trace.setAttribute('d',th<180?arcD(180,th):'');setTimer(t1+(t2-t1)*p);};}

/* ---------- תוכן ---------- */
const s=(v,p)=>`${v}<sub>${p}</sub>`;
const m=lines=>`<div class="math">${lines.map(l=>`<div>${l}</div>`).join('')}</div>`;
const sol=(type,parts)=>`<div class="sol"><span class="chip type">סוג התרגיל: ${type}</span>`+
  parts.map(([h,l])=>`<details open><summary>${h}</summary>${m(l)}</details>`).join('')+`</div>`;

const Q=`<b>השאלה:</b> גלגל ענק מסתובב במהירות קבועה <b>עם כיוון השעון</b> ומשלים סיבוב שלם ב-<b>40 שניות</b>.
מרכז הגלגל C נמצא בגובה <b>25 מ׳</b> מעל הקרקע, ורדיוס הגלגל <b>20 מ׳</b>.
קרונית מתחילה לנוע מנקודה A הנמצאת <b>בגובה המרכז, בצד השמאלי</b> של הגלגל.
ראשית הצירים O נמצאת על הקרקע, בדיוק מתחת למרכז הגלגל.
<ol type="א">
<li>מצאו את שיעורי הנקודה A.</li>
<li>מצאו את היקף הגלגל L.</li>
<li>מצאו את מהירות הקרונית v.</li>
<li>מצאו את המהירות הזוויתית ω של הגלגל.</li>
<li>הקרונית נעה במשך 8 שניות והגיעה לנקודה B. מה אורך הדרך שעברה, ובאיזו זווית הסתובבה?</li>
<li>מצאו את שיעורי הנקודה B.</li>
<li>מתי תגיע הקרונית לראשונה לנקודה הגבוהה ביותר בגלגל, D, ומה גובהה?</li>
</ol>`;

const steps=[
 {intro:true, run:async()=>{}},
 {tag:'נתון',text:"ראשית הצירים O על הקרקע מתחת למרכז. מרכז הגלגל C נמצא בגובה 25 מ׳ מעל הקרקע.",
  temp:[gH],run:(a,my)=>reveal(a,my,gAxes,gC,gH)},
 {tag:'נתון',text:"רדיוס הגלגל הוא 20 מ׳.",temp:[gR],run:(a,my)=>reveal(a,my,gR)},
 {tag:'נתון',text:'הגלגל מסתובב עם כיוון השעון ומשלים סיבוב שלם ב-40 שניות (זמן מחזור T).',
  run:async(a,my)=>{if(!await reveal(a,my,gDir))return;if(a){timer.textContent='סיבוב מלא (מואץ פי 10)';show(timer);
    await tween(4000,p=>setTheta(180-360*p),my);if(my!==token)return;setTheta(180);timer.classList.add('hid');}}},
 {tag:'נתון',text:'הקרונית מתחילה לנוע מנקודה A – בגובה המרכז, בצד השמאלי של הגלגל.',
  run:(a,my)=>{cab.classList.add('hl');return reveal(a,my,gA);}},
 {tag:'סעיף א',sec:true,text:'מצאו את שיעורי הנקודה A.',ans:'A(−20, 25)',
  sol:sol('שאלת מיקום',[
   ['מוצאים את זווית ההתחלה של A: הזווית נמדדת מהכיוון החיובי של ציר x נגד כיוון השעון, ו-A נמצאת בדיוק משמאל למרכז',[`${s('θ','A')} = 180°`]],
   ['רושמים את הנוסחה הכללית למיקום נקודה על מעגל לפי זווית',['x = x<sub>C</sub> + R · cos θ','y = y<sub>C</sub> + R · sin θ']],
   ['מציבים את זווית ההתחלה ומחשבים את x של A בעזרת cos',[`${s('x','A')} = ${s('x','C')} + R · cos ${s('θ','A')}`,`${s('x','A')} = 0 + 20 · cos 180°`,`${s('x','A')} = 0 + 20 · (−1) = −20`]],
   ['מציבים את זווית ההתחלה ומחשבים את y של A בעזרת sin',[`${s('y','A')} = ${s('y','C')} + R · sin ${s('θ','A')}`,`${s('y','A')} = 25 + 20 · sin 180°`,`${s('y','A')} = 25 + 20 · 0 = 25`]],
   ['כותבים את שיעורי הנקודה',['A(−20, 25)']]]),
  temp:[gTh],run:(a,my)=>reveal(a,my,gAc,gTh)},
 {tag:'סעיף ב',sec:true,text:'מצאו את היקף הגלגל L.',ans:"L = 40π ≈ 125.66 מ׳",
  sol:sol('שאלת מרחק',[
   ['רושמים את נוסחת היקף המעגל',['L = 2πR']],
   ['מציבים את הרדיוס',['L = 2π · 20 = 40π ≈ 125.66 מ׳']]]),
  run:async(a,my)=>{show(Lc);if(a){if(!await tween(1800,p=>Lc.setAttribute('stroke-dashoffset',1-p),my))return;}else Lc.setAttribute('stroke-dashoffset',0);
    return reveal(a,my,gLt);}},
 {tag:'סעיף ג',sec:true,text:'מצאו את מהירות הקרונית v.',ans:"v = π ≈ 3.14 מ׳ לשנייה",
  sol:sol('שאלת מרחק (מהירות)',[
   ['רושמים את נוסחת הבסיס: דרך = מהירות × זמן',['s = v · t']],
   ['מבודדים את המהירות',['v = s / t']],
   ['מציבים: בזמן מחזור אחד T הקרונית עוברת היקף שלם L',['v = L / T','v = 40π / 40 = π ≈ 3.14 מ׳ לשנייה']]]),
  run:(a,my)=>reveal(a,my,gV)},
 {tag:'סעיף ד',sec:true,text:'מצאו את המהירות הזוויתית ω של הגלגל.',ans:"ω = 9° לשנייה",
  sol:sol('שאלת מרחק (מהירות זוויתית)',[
   ['רושמים את נוסחת הבסיס לסיבוב: זווית = מהירות זוויתית × זמן – בדיוק כמו דרך = מהירות × זמן',['α = ω · t &nbsp;&nbsp;&nbsp;⟷&nbsp;&nbsp;&nbsp; s = v · t','<span style="font-family:Segoe UI,Arial;font-size:15px;color:#6b21a8" dir="rtl">זווית ↔ דרך &nbsp;|&nbsp; מהירות זוויתית ↔ מהירות &nbsp;|&nbsp; זמן ↔ זמן</span>']],
   ['מבודדים את המהירות הזוויתית',['ω = α / t']],
   ['מציבים: בזמן מחזור אחד T הגלגל מסתובב 360°',['ω = 360° / T','ω = 360° / 40 = 9° לשנייה']]]),
  run:(a,my)=>reveal(a,my,gW)},

/* ---------- הצגה ---------- */
const panel=document.getElementById('panel');
let cur=0;
let shown=0;
function renderPanel(i){
  const isNew=i>shown; if(isNew)shown=i;
  const keep=panel.scrollTop;
  let h=`<details class="qbox" ${i===0?'open':''}><summary>השאלה המלאה</summary>${Q}</details>`;
  if(shown===0)h+=`<p class="hint">לחצו "הבא" – כל נתון וכל סעיף יתווסף בתחתית הרשימה, ומשמעותו תסומן בסימולטור משמאל. אפשר לגלול למעלה וללחוץ על סעיף קודם כדי לחזור למצב שלו.</p>`;
  h+='<ol class="items">';
  for(let k=1;k<=shown;k++){const st=steps[k];
    const cls=(k===i?'cur':k<i?'done':'ahead')+(isNew&&k===i?' new':'');
    h+=`<li class="${cls}" data-k="${k}"><span class="chip ${st.sec?'sec':''}">${st.tag}</span><span class="qtext">${st.text}</span>`;
    if(k===i&&st.sol)h+=st.sol; else if(k!==i&&st.ans)h+=`<div class="ans">✓ ${[].concat(st.ans).map(x=>`<span>${x}</span>`).join('')}</div>`;
    h+='</li>';}
  panel.innerHTML=h+'</ol>';
  panel.querySelectorAll('li[data-k]').forEach(li=>li.onclick=()=>{const k=+li.dataset.k;if(k!==cur)go(k);});
  panel.style.scrollBehavior='auto';panel.scrollTop=keep;panel.style.scrollBehavior='';
  const c=panel.querySelector('li.cur');
  if(isNew)panel.scrollTo({top:panel.scrollHeight});
  else if(c)c.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function resetDrawing(){
  svg.querySelectorAll('.se').forEach(e=>e.classList.add('hid'));
  cab.classList.remove('hl');trace.setAttribute('d','');Lc.setAttribute('stroke-dashoffset',1);setTheta(180);
}
async function go(i){
  cur=Math.max(0,Math.min(steps.length-1,i));const my=++token;
  renderPanel(cur);
  svg.classList.add('instant');resetDrawing();
  for(let k=1;k<cur;k++)await steps[k].run(false,my);
  for(let k=1;k<cur;k++)(steps[k].temp||[]).forEach(e=>e.classList.add('hid'));
  void svg.getBoundingClientRect();svg.classList.remove('instant');
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===steps.length-1;
  document.getElementById('cnt').textContent=`${cur} / ${steps.length-1}`;
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k<=cur));
  if(!(await wait(700,my)))return;           // קודם הטקסט, אחר כך השרטוט
  await steps[cur].run(true,my);
}
const dots=document.getElementById('dots');
steps.forEach((_,k)=>{const d=document.createElement('i');d.title=k?steps[k].tag:'השאלה';d.onclick=()=>go(k);dots.appendChild(d);});
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('replay').onclick=()=>go(cur);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
});
setTheta(180);go(0);
</script>
