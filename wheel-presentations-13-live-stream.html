<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">

<title>מצגת עם סיפור – שידור חי מגובה 40 מטר</title>
<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc;
    --cab:#f97316; --R:#2563eb; --L:#16a34a; --ang:#9333ea; --B:#dc2626; --D:#0891b2;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
  header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 16px;background:#fff;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0}
  header a{color:var(--R);text-decoration:none;font-size:14px}
  .wrap{flex:1;min-height:0;display:flex;gap:10px;padding:10px}
  /* RTL: הילד הראשון (הטקסט) בצד ימין, הסימולטור בצד שמאל */
  .panel{flex:0 0 47%;overflow-y:auto;padding-left:6px;scroll-behavior:smooth}
  .stage{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;align-items:center;justify-content:center}
  svg{width:100%;height:100%;display:block;direction:ltr}
  @media (max-width:700px){body{overflow:auto;display:block}.wrap{flex-direction:column}.panel{flex:none;overflow:visible}.stage{order:-1}}

  .qfull,.qbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;line-height:1.75}
  .qfull{font-size:17px}
  .qbox summary{cursor:pointer;font-weight:700;color:var(--muted)}
  .qfull ol,.qbox ol{margin:6px 0 0;padding-right:22px}
  .hint{color:var(--muted);margin-top:12px}

  ol.items{list-style:none;margin:12px 0 0;padding:0}
  ol.items li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;cursor:pointer}
  ol.items li.new{animation:pop .5s ease both}
  ol.items li.ahead{opacity:.5}
  ol.items li.cur{cursor:default}
  ol.items li.cur{border:2px solid var(--cab);box-shadow:0 4px 14px rgba(249,115,22,.15)}
  ol.items li.done{opacity:.8}
  .chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin-left:8px;background:#e0f2fe;color:#075985}
  .chip.sec{background:#ffedd5;color:#9a3412}
  .chip.type{background:#f3e8ff;color:#6b21a8}
  .qtext{font-size:17px;line-height:1.6}
  .ans{margin-top:6px;color:#166534;font-weight:600}
  .ans span{margin-left:14px}
  .ans span,.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .sol{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  li.new .sol{animation:pop .6s .5s ease both}
  .sol details{margin:6px 0}
  .sol summary{cursor:pointer;font-weight:700;line-height:1.5}
  .math{direction:ltr;text-align:left;font-family:"Cambria Math","Times New Roman",serif;font-size:17px;background:#f8fafc;border-radius:8px;padding:6px 12px;margin-top:4px}
  .math div{padding:2px 0}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* svg */
  .se{transition:opacity .6s}
  .hid{opacity:0}
  .instant .se{transition:none}
  .lbl{font:700 15px "Segoe UI",Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;fill:var(--ink)}
  .gond rect{fill:#e2e8f0;stroke:#64748b;stroke-width:1.5}
  .cab.hl rect{fill:var(--cab);stroke:#9a3412}
  .dash{stroke-dasharray:6 5}

  .bar{flex:none;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;padding:7px;flex-wrap:wrap}
  .bar button{font:inherit;font-size:16px;border:0;border-radius:10px;padding:8px 18px;cursor:pointer;background:#e2e8f0}
  .bar button.main{background:var(--cab);color:#fff;font-weight:700}
  .bar button:disabled{opacity:.4;cursor:default}
  .dots{display:flex;gap:5px}
  .dots i{width:9px;height:9px;border-radius:50%;background:#cbd5e1;cursor:pointer}
  .dots i.on{background:var(--cab)}
</style>
<style>
.bub{direction:rtl;text-align:right;background:#fff;border:2.5px solid #f97316;border-radius:16px;padding:6px 10px;font:600 14px "Segoe UI",Arial,sans-serif;line-height:1.4;color:#0f172a;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.bub .who{display:inline-block;background:#f97316;color:#fff;border-radius:999px;padding:0 9px;margin-left:6px;font-size:12px}
.bulb{animation:blink 1.2s infinite}.b1{animation-delay:.4s}.b2{animation-delay:.8s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.clouds{animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-90px)}}
.burst{animation:boom 1.8s ease-out infinite}
@keyframes boom{0%{transform:scale(.15);opacity:0}15%{opacity:1}100%{transform:scale(1.35);opacity:0}}
.qbox,.qfull{background:#fffbeb}
.livebadge,.bars{display:none}
.cab.hl.live .livebadge,.cab.hl.live .bars{display:inline}
.cab.hl:not(.live) .nosig{display:inline}.nosig{display:none}
.cab:not(.hl) .kname{display:none}
.rec{animation:rec 1s infinite}@keyframes rec{50%{opacity:.2}}
</style>

<style>.pdot.hl{fill:#f97316;stroke:#9a3412} .pdot{opacity:0} .pdot.hl{opacity:1}</style>

<script>
const s=(v,p)=>`${v}<sub>${p}</sub>`;
const m=lines=>`<div class="math">${lines.map(l=>`<div>${l}</div>`).join('')}</div>`;
const sol=(type,parts)=>`<div class="sol"><span class="chip type">סוג התרגיל: ${type}</span>`+parts.map(([h,l])=>`<details open><summary>${h}</summary>${m(l)}</details>`).join('')+`</div>`;
const heb=t=>`<span style="font-family:Segoe UI,Arial;font-size:15px;color:#6b21a8" dir="rtl">${t}</span>`;
const LTR=t=>`<span class="ltr">${t}</span>`;
const BASE_H='רושמים את נוסחת הבסיס לסיבוב: זווית = מהירות זוויתית × זמן – בדיוק כמו דרך = מהירות × זמן';
const BASE=['α = ω · t &nbsp;&nbsp;⟷&nbsp;&nbsp; s = v · t',heb('זווית ↔ דרך &nbsp;|&nbsp; מהירות זוויתית ↔ מהירות &nbsp;|&nbsp; זמן ↔ זמן')];
const BASE_S=['s = v · t'];
const SV=(sub)=>`<tspan>${sub}</tspan>`;
const ts=(v,i)=>`${v}<tspan dy="5" font-size="11">${i}</tspan><tspan dy="-5"></tspan>`;

/* ===== שידור חי מגובה 40 מטר ===== */
const CFG={
 mode:'ground', xc:0, yc:22, R:18, th0:270, w:3,
 Q:`<b>📡 שידור חי מגובה 40 מטר</b><br>
<b>עומר</b>, יוצר תוכן עם 80 אלף עוקבים, החליט לשדר לייב מגלגל ענק בלונה־פארק.
מרכז הגלגל C בגובה <b>22 מ׳</b>, רדיוסו <b>18 מ׳</b>, והוא מסתובב <b>נגד כיוון השעון</b>, סיבוב שלם בכל <b>2 דקות</b>.
עומר עולה לקרונית ב<b>נקודה הנמוכה ביותר</b>, A.
הבעיה: אנטנת הסלולר מוסתרת מאחורי בניין, ו<b>הקליטה טובה רק מעל 31 מ׳</b>. מתחת לזה השידור תקוע על "מתחבר...".
<ol type="א">
<li>מה המהירות הזוויתית ω של הגלגל?</li>
<li>רחפן צריך לטוס לצד הקרונית ולצלם אותה. באיזו מהירות v הוא צריך לטוס?</li>
<li>באילו זוויות הקרונית בגובה 31 מ׳?</li>
<li>מתי השידור עולה לאוויר (נקודה B)?</li>
<li>מתי השידור נקטע (נקודה D)?</li>
<li>כמה שניות של שידור יש בכל סיבוב?</li>
<li>עומר רוצה לצלם את השקיעה בדיוק מראש הגלגל. מתי הוא מגיע לשם (נקודה E), ובאיזה גובה?</li>
</ol>`,
 draw:[
  {id:'C',kind:'C',label:'C(0, 22)',dx:-12,dy:22,anchor:'end'},
  {id:'hC',kind:'vdim',xpx:395,y1:0,y2:22,guide:'C',label:'22 מ׳',side:'left'},
  {id:'Rs',kind:'seg',from:'C',to:{th:135},color:'L',label:'R = 18 מ׳',lx:-8,anchor:'end'},
  {id:'dir',kind:'dir',at:155},
  {id:'A',kind:'pt',at:{th:270},ring:true,color:'cab',label:'A',lx:18,ly:14},
  {id:'h31',kind:'hline',y:31,color:'B',label:'y = 31 – גבול הקליטה'},
  {id:'iW',kind:'info',line:4,text:'ω = 3° לשנייה'},
  {id:'L',kind:'rim',from:0,to:360,color:'L'},
  {id:'iV',kind:'info',line:5,text:'v = 0.3π ≈ 0.94 מ׳ לשנייה'},
  {id:'c1',kind:'pt',at:{th:30},color:'#94a3b8',label:'30°',lx:14,ly:22,lc:'ang'},
  {id:'c2',kind:'pt',at:{th:150},color:'#94a3b8',label:'150°',lx:-14,ly:22,anchor:'end',lc:'ang'},
  {id:'wB',kind:'wedge',from:270,to:390,r:44,label:'α = 120°',lth:330,lr:66},
  {id:'B',kind:'pt',at:{th:30},color:'B',label:'B: t = 40',lx:-14,ly:-10,anchor:'end'},
  {id:'wD',kind:'wedge',from:270,to:510,r:36,label:'α = 240°',lth:20,lr:56},
  {id:'D',kind:'pt',at:{th:150},color:'D',label:'D: t = 80',lx:-14,ly:20,anchor:'end'},
  {id:'onair',kind:'rim',from:30,to:150,color:'B'},
  {id:'wE',kind:'wedge',from:270,to:450,r:40,label:'α = 180°',lth:0,lr:62},
  {id:'E',kind:'pt',at:{th:90},color:'D',label:'E: t = 60, h = 40 מ׳',lx:-20,ly:34,anchor:'end'},
  {id:'fw',kind:'fireworks'},
  {id:'b1',kind:'bubble',who:'אבי, המפעיל',text:'22 מטר עד הציר. 31 שנה אני מפעיל את הגלגל הזה, ואף אחד עוד לא שאל אותי על קליטה.'},
  {id:'b2',kind:'bubble',who:'אבי, המפעיל',text:'רדיוס 18 מטר. ולא, הוא לא יסתובב מהר יותר אם תבקש יפה בתגובות.'},
  {id:'b3',kind:'bubble',who:'אבי, המפעיל',text:'סיבוב בכל 2 דקות. זה גלגל ענק, לא שיעור ספינינג.'},
  {id:'b4',kind:'bubble',who:'עומר',text:'אהלן לכולם! אני עולה עכשיו לגלגל, תכף אנחנו באוויר. ...תכף. ברגע שתהיה קליטה.'},
  {id:'b5',kind:'bubble',who:'עומר',text:'האפליקציה כותבת "מתחבר...". מתחת ל־31 מטר אני בעצם מדבר לעצמי.'},
  {id:'b7',kind:'bubble',who:'אבי, המפעיל',text:'3 מעלות בשנייה. בקצב הזה אני מספיק לגמור קפה ולקרוא את כל העיתון. כולל המודעות.'},
  {id:'b8',kind:'bubble',who:'עומר',text:'0.94 מטר לשנייה. הרחפן שלי טס 15 מטר לשנייה, אז רוב הזמן הוא סתם ירחף לידי במבוכה.'},
  {id:'b9',kind:'bubble',who:'אבי, המפעיל',text:'שתי נקודות על גבול הקליטה: באחת השידור עולה, ובשנייה הוא נופל. כמו רוב הקריירות ברשת.'},
  {id:'b10',kind:'bubble',who:'עומר',text:'אנחנו באוויר! 2,000 צופים! תכתבו בתגובות מאיפה אתם צופים!'},
  {id:'b11',kind:'bubble',who:'עומר',text:'...הלו? נתקע. מישהו עוד שומע? אמא, את עדיין שם?'},
  {id:'b12',kind:'bubble',who:'אבי, המפעיל',text:'40 שניות שידור בכל סיבוב. בדיוק מספיק כדי להגיד "אל תשכחו להירשם לערוץ".'},
  {id:'b13',kind:'bubble',who:'עומר',text:'40 מטר, שקיעה, קליטה מלאה. זה הצילום של השנה. ...רגע, למה הסוללה על 1%?'},
 ],
 steps:[
  {tag:'סיפור',text:'מרכז הגלגל C נמצא בגובה 22 מ׳.',temp:['hC','b1'],seq:['axes','C','hC','b1']},
  {tag:'סיפור',text:'רדיוס הגלגל 18 מ׳.',temp:['Rs','b2'],seq:['Rs','b2']},
  {tag:'סיפור',text:'הגלגל מסתובב נגד כיוון השעון, סיבוב שלם בכל 2 דקות.',temp:['b3'],seq:['dir','b3',{spin:{label:'סיבוב שלם (מואץ)',dur:4000}}]},
  {tag:'סיפור',text:'עומר עולה לקרונית בנקודה הנמוכה ביותר – נקודה A.',temp:['b4'],seq:['A',{hl:1},'b4']},
  {tag:'סיפור',text:'הקליטה טובה רק מעל 31 מ׳. מתחת לזה השידור לא עולה.',temp:['b5'],seq:['h31','b5']},
  {tag:'סעיף א',sec:true,text:'מה המהירות הזוויתית ω של הגלגל?',ans:'ω = 3° לשנייה',
   sol:['שאלת מרחק זוויתי',[[BASE_H,BASE],['מבודדים את המהירות הזוויתית',['ω = α / t']],
    ['מציבים סיבוב שלם בזמן מחזור אחד: 2 דקות = 120 שניות. נגד כיוון השעון הזווית עולה, לכן ω חיובית',['T = 2 · 60 = 120','ω = 360° / T','ω = 360° / 120 = 3° לשנייה']]]],
   temp:['b7'],seq:['iW','b7']},
  {tag:'סעיף ב',sec:true,text:'רחפן צריך לטוס לצד הקרונית ולצלם אותה. באיזו מהירות v הוא צריך לטוס?',ans:'v = 0.3π ≈ 0.94 מ׳ לשנייה',
   sol:['שאלת מרחק (מהירות)',[
    ['הרחפן טס במהירות של הקרונית. בסיבוב אחד הקרונית עוברת היקף שלם, לכן רושמים את נוסחת ההיקף',['L = 2πR','L = 2π · 18 = 36π ≈ 113.1 מ׳']],
    ['רושמים את נוסחת הבסיס: דרך = מהירות × זמן',['s = v · t']],
    ['מבודדים את המהירות',['v = s / t']],
    ['מציבים: בזמן מחזור אחד הקרונית עוברת היקף שלם',['v = L / T','v = 36π / 120 = 0.3π ≈ 0.94 מ׳ לשנייה']]]],
   temp:['L','b8'],seq:['L','iV','b8']},
  {tag:'סעיף ג',sec:true,text:'באילו זוויות הקרונית בגובה 31 מ׳?',ans:'θ = 30° או θ = 150°',
   sol:['שאלת מיקום',[
    ['רושמים את הנוסחה הכללית לגובה של נקודה על הגלגל',[`y = ${s('y','C')} + R · sin θ`]],
    ['מציבים את גובה גבול הקליטה',['31 = 22 + 18 · sin θ']],
    ['מבודדים את sin θ',['18 · sin θ = 31 − 22 = 9','sin θ = 9 / 18 = 1/2']],
    ['מוצאים את שתי הזוויות – שתי הנקודות על גבול הקליטה',['θ = 30° &nbsp;&nbsp;או&nbsp;&nbsp; θ = 150°']]]],
   temp:['c1','c2','b9'],seq:['c1','c2','b9']},
  {tag:'סעיף ד',sec:true,text:'מתי השידור עולה לאוויר (נקודה B)?',ans:`${s('t','B')} = 40 שניות`,
   sol:['שאלת מרחק זוויתי',[
    ['הזווית עולה מ-270°. אחרי 360° מגיעים לצד ימין, ושם הקרונית חוצה את הקו ב-30° + 360°',[`${s('θ','B')} = 30° + 360° = 390°`]],
    ['מחשבים בכמה מעלות הקרונית מסתובבת מ-A עד B',[`α = ${s('θ','B')} − ${s('θ','A')}`,'α = 390° − 270° = 120°']],
    ['רושמים את נוסחת הבסיס (כמו דרך = מהירות × זמן) ומבודדים את הזמן',['α = ω · t','t = α / ω']],
    ['מציבים',[`${s('t','B')} = 120 / 3 = 40 שניות`]]]],
   temp:['wB','b10'],seq:[{move:{from:270,to:390,t2:40,dur:4000}},'wB','B','b10']},
  {tag:'סעיף ה',sec:true,text:'מתי השידור נקטע (נקודה D)?',ans:`${s('t','D')} = 80 שניות`,
   sol:['שאלת מרחק זוויתי',[
    ['ממשיכים לעלות בזווית עד שהקרונית חוצה את הקו שוב, בצד שמאל: 150° + 360°',[`${s('θ','D')} = 150° + 360° = 510°`]],
    ['מחשבים בכמה מעלות הקרונית מסתובבת מ-A עד D',[`α = ${s('θ','D')} − ${s('θ','A')}`,'α = 510° − 270° = 240°']],
    ['מבודדים את הזמן מנוסחת הבסיס ומציבים',['t = α / ω',`${s('t','D')} = 240 / 3 = 80 שניות`]]]],
   temp:['wD','b11'],seq:[{move:{from:270,to:510,t2:80,dur:5000}},'wD','D','b11']},
  {tag:'סעיף ו',sec:true,text:'כמה שניות של שידור יש בכל סיבוב?',ans:'40 שניות',
   sol:['שאלת מרחק זוויתי',[
    ['השידור באוויר בדרך מ-B ל-D (הקשת העליונה). מחסירים את שני הזמנים',[`Δt = ${s('t','D')} − ${s('t','B')}`,'Δt = 80 − 40 = 40 שניות']],
    ['בדיקה עם נוסחת הבסיס: מ-30° עד 150° הקרונית מסתובבת 120°',['Δt = α / ω = 120 / 3 = 40 ✓']]]],
   temp:['b12'],seq:['onair',{move:{from:390,to:510,t1:40,t2:80,dur:4000}},'b12']},
  {tag:'סעיף ז',sec:true,text:'עומר רוצה לצלם את השקיעה בדיוק מראש הגלגל. מתי הוא מגיע לשם (נקודה E), ובאיזה גובה?',ans:[`${s('t','E')} = 60 שניות`,`${s('h','E')} = 40 מ׳`],

    if(o.label){const[x,y]=P(o.lth??((o.from??0)+o.to)/2,o.lr??r+24);txt(x+(o.lx||0),y+(o.ly||0),o.label,{fill:c,'text-anchor':o.anchor||'middle'},g);}},
  wedge:(g,o)=>{const c=col('ang'),r=o.r??42;el('path',{d:wedgeD(o.from,o.to,r),fill:'rgba(147,51,234,.16)',stroke:c,'stroke-width':2},under).setAttribute('data-g',o.id);
    if(o.label){const[x,y]=P(o.lth??(o.from+o.to)/2,o.lr??r+22);txt(x+(o.lx||0),y+(o.ly||0),o.label,{fill:c,'text-anchor':o.anchor||'middle'},g);}},
  rim:(g,o)=>{el('path',{d:arcD(o.from,o.to,R),fill:'none',stroke:col(o.color),'stroke-width':8,'stroke-linecap':'round',opacity:.75},g);
    if(o.label){const[x,y]=P(o.lth??(o.from+o.to)/2,R+(o.lr??26));txt(x+(o.lx||0),y+(o.ly||0),o.label,{fill:col(o.color),'text-anchor':o.anchor||'middle'},g);}},
  dir:(g,o)=>{const c=COL.cab,a=o.at??110,sp=DIR>0?40:-40;
    el('path',{d:arcD(a-sp/2,a+sp/2,R+26),fill:'none',stroke:c,'stroke-width':4,'marker-end':mk(c)},g);
    (o.lines||[]).forEach((l,i)=>txt(12,62+22*i,l,{fill:'#c2410c'},g));},
  info:(g,o)=>{txt(490,30+22*(o.line||0),o.text,{fill:col(o.color??'L'),'text-anchor':'end'},g);},
  text:(g,o)=>{const[tx,ty]=o.at?spec(o.at):[o.x,o.y];txt(tx,ty,o.text,{fill:col(o.color??'ink'),'text-anchor':o.anchor||'start',style:o.size?`font-size:${o.size}px`:''},g);},
  marker:(g,o)=>{const[x,y]=spec(o.at),c=col(o.color);const d=o.dir??DIR,a=(o.th)*Math.PI/180,vx=-Math.sin(a)*d,vy=-Math.cos(a)*d;
    line(x,y,x+vx*38,y+vy*38,{stroke:c,'stroke-width':4,'marker-end':mk(c)},g);
    if(o.label)txt(x+vx*44+(o.lx||0),y+vy*44+(o.ly||0)+5,o.label,{fill:c,'text-anchor':o.anchor||(vx<0?'end':'start')},g);},
  proj:(g,o)=>{const[x,y]=spec(o.at),y0=GROUND?GY:Y(0),x0=X(0);
    if(o.toX!==false)line(x,y,x,y0,{stroke:'#334155',class:'dash'},g);
    if(o.toY!==false)line(x,y,x0,y,{stroke:'#334155',class:'dash'},g);
    if(o.xl)txt(x,y0+(GROUND?20:30),o.xl,{'text-anchor':'middle',fill:col(o.color??'ink')},g);
    if(o.yl)txt(x0+(x<x0?8:-8),y+(o.yly??-6),o.yl,{'text-anchor':x<x0?'start':'end',fill:col(o.color??'ink')},g);},
};
if(typeof EXTRA_BUILD!=='undefined')Object.assign(BUILD,EXTRA_BUILD);
(F.draw||[]).forEach(o=>{const g=el('g',{class:'se hid'},(o.top||o.kind==='pt')?front:svg);G[o.id]=g;BUILD[o.kind](g,o);});
svg.appendChild(cab);svg.appendChild(front);
const timer=txt(12,30,'',{class:'lbl se hid',fill:'#c2410c',style:'font-size:20px'});
if(typeof THEME==='function')THEME('after');

/* ---------- מצב ---------- */
let theta=START;
function setTheta(th){
  theta=th;spokes.setAttribute('transform',`rotate(${START-th} ${CX} ${CY})`);
  const[x,y]=P(th);
  if(MODE==='ground'){cab.setAttribute('transform',`translate(${x} ${y})`);decor.forEach((g,i)=>{const[a,b]=P(th+45*(i+1));g.setAttribute('transform',`translate(${a} ${b})`);});}
  else{cab.setAttribute('cx',x);cab.setAttribute('cy',y);}
}
const show=e=>e&&e.classList.remove('hid');
const grpEl=id=>id==='wheel'?wheel:G[id];
function showG(id){show(grpEl(id));under.querySelectorAll(`[data-g="${id}"]`).forEach(w=>w.style.display='');}
function hideG(id){const e=grpEl(id);if(e)e.classList.add('hid');under.querySelectorAll(`[data-g="${id}"]`).forEach(w=>w.style.display='none');}
let token=0;
const wait=(ms,my)=>new Promise(r=>setTimeout(()=>r(my===token),ms));
function tween(dur,f,my){return new Promise(res=>{const t0=performance.now();
  function fr(now){if(my!==token)return res(false);const p=Math.min(1,(now-t0)/dur);f(p);p<1?requestAnimationFrame(fr):res(true);}requestAnimationFrame(fr);});}
const fmt=t=>{const r=Math.round(t*100)/100;return Number.isInteger(r)?String(r):r.toFixed(2).replace(/0$/,'');};
function setTimer(t,note){timer.textContent=`t = ${fmt(t)} שניות${note?'  '+note:''}`;show(timer);}
async function runSeq(seq,a,my){
  for(const it of seq||[]){
    if(my!==token)return;
    if(typeof it==='string'){if(a&&!(await wait(600,my)))return;showG(it);continue;}
    if(it.wait){if(a&&!(await wait(it.wait,my)))return;continue;}
    if(it.hl){cab.classList.add('hl');continue;}
    if(it.timer!==undefined){if(it.timer===false)timer.classList.add('hid');else{timer.textContent=it.timer;show(timer);}continue;}
    if(it.draw){const e=it.draw==='wheel'?rimDraw:G[it.draw];show(e);if(it.draw==='wheel'){if(a){if(!await tween(1600,p=>rimDraw.setAttribute('stroke-dashoffset',1-p),my))return;}rimDraw.classList.add('hid');showG('wheel');}continue;}
    if(it.spin){if(!a)continue;const d=it.spin.dur||4000,from=theta;timer.textContent=it.spin.label;show(timer);
      if(!await tween(d,p=>setTheta(from+DIR*360*p*(it.spin.turns||1)),my))return;setTheta(from);timer.classList.add('hid');continue;}
    if(it.set!==undefined){setTheta(it.set);if(it.clear)trace.setAttribute('d','');continue;}
    if(it.move){const m=it.move,from=m.from??theta,t1=m.t1??0,t2=m.t2,real=(t2-t1)*1000,dur=m.dur??real;
      const note=dur<real*0.7?`(מואץ ×${Math.round(real/dur)})`:dur>real*1.4?'(הילוך איטי)':'';
      const f=p=>{const th=from+(m.to-from)*p;setTheta(th);trace.setAttribute('d',Math.abs(th-from)>0.05?arcD(from,th):'');setTimer(t1+(t2-t1)*p,p<1?note:'');};
      if(a){f(0);if(!await wait(300,my))return;if(!await tween(dur,f,my))return;}else f(1);continue;}
  }
}

/* ---------- תוכן ---------- */
const panel=document.getElementById('panel');
const steps=[{intro:true}].concat(F.steps);
let cur=0,shown=0;
function renderPanel(i){
  const isNew=i>shown;if(isNew)shown=i;const keep=panel.scrollTop;
  let h=`<details class="qbox" ${i===0?'open':''}><summary>השאלה המלאה</summary>${F.Q}</details>`;
  if(shown===0)h+=`<p class="hint">לחצו "הבא" – כל נתון וכל סעיף יתווסף בתחתית הרשימה, ומשמעותו תסומן בסימולטור משמאל. אפשר לגלול למעלה וללחוץ על סעיף קודם כדי לחזור למצב שלו.</p>`;
  h+='<ol class="items">';
  for(let k=1;k<=shown;k++){const st=steps[k];
    const cls=(k===i?'cur':k<i?'done':'ahead')+(isNew&&k===i?' new':'');
    h+=`<li class="${cls}" data-k="${k}"><span class="chip ${st.sec?'sec':''}">${st.tag}</span><span class="qtext">${st.text}</span>`;
    if(k===i&&st.sol)h+=sol(st.sol[0],st.sol[1]);else if(k!==i&&st.ans)h+=`<div class="ans">✓ ${[].concat(st.ans).map(x=>`<span>${x}</span>`).join('')}</div>`;
    h+='</li>';}
  panel.innerHTML=h+'</ol>';
  panel.querySelectorAll('li[data-k]').forEach(li=>li.onclick=()=>{const k=+li.dataset.k;if(k!==cur)go(k);});
  panel.style.scrollBehavior='auto';panel.scrollTop=keep;panel.style.scrollBehavior='';
  const c=panel.querySelector('li.cur');if(isNew)panel.scrollTo({top:panel.scrollHeight});else if(c)c.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function resetDrawing(){
  svg.querySelectorAll('.se').forEach(e=>e.classList.add('hid'));under.querySelectorAll('[data-g]').forEach(w=>w.style.display='none');
  cab.classList.remove('hl');trace.setAttribute('d','');rimDraw.setAttribute('stroke-dashoffset',1);setTheta(START);
  if(!GROUND&&!F.wheelVisible)wheel.classList.add('hid');
}
async function go(i){
  cur=Math.max(0,Math.min(steps.length-1,i));const my=++token;window.__done=-1;
  renderPanel(cur);svg.classList.add('instant');resetDrawing();
  for(let k=1;k<cur;k++)await runSeq(steps[k].seq,false,my);
  for(let k=1;k<cur;k++)(steps[k].temp||[]).forEach(hideG);
  void svg.getBoundingClientRect();svg.classList.remove('instant');
  document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===steps.length-1;
  document.getElementById('cnt').textContent=`${cur} / ${steps.length-1}`;
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k<=cur));
  if(!(await wait(700,my)))return;
  if(cur>0)await runSeq(steps[cur].seq,true,my);
  if(my===token)window.__done=cur;
}
const dots=document.getElementById('dots');
steps.forEach((_,k)=>{const d=document.createElement('i');d.title=k?steps[k].tag:'השאלה';d.onclick=()=>go(k);dots.appendChild(d);});
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('replay').onclick=()=>go(cur);
document.addEventListener('keydown',e=>{if(e.target.tagName==='SUMMARY')return;
  if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();go(cur-1);}});
setTheta(START);go(0);

</script>
</body>
