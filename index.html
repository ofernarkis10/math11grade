      d:"מה זה סינוס וקוסינוס: מעגל היחידה, איך מודדים זווית במעגל, וההגדרה — הנקודה של הזווית היא (cos α, sin α), כלומר cos הוא ה־x שלה ו־sin הוא ה־y. הקשר למשולש ישר זווית, הערכים של 0°, 30°, 45°, 60°, 90° ושל הזוויות על הצירים, סימנים לפי רביע וטווח הערכים. עם מעבדה אינטראקטיבית ותרגול עם דרך החשיבה בכל פתרון." },

      d:"מערכת צירים קוטבית (מרחק וזווית במעלות) והמעבר לקרטזי, הגדרת sin ו־cos לכל זווית ורביעים. אחר כך, שלב אחר שלב: מיקום נקודה על גלגל שלא זז, על גלגל שזז (תנועת המרכז ועוד מיקום על הגלגל), ומהירות זוויתית לאורך זמן. השלב האחרון הוא השאלה: באיזו מהירות נעה נקודה על גלגל שנוסע ומסתובב ביחס לכביש? כולל סימולציות אינטראקטיביות ונספח על הגרפים של sin ו־cos." },

      d:"השוואה צמודה בין תנועה בקו ישר מ־A ל־B לבין תנועה על גלגל: אותם חמישה שלבים: נתונים, משוואת המסלול (הישר y = mx + b דרך A ו־B, או משוואת המעגל), הפרמטר לפי הזמן (אחוז מהדרך או זווית), x לפי הפרמטר, ו־y מהצבה במשוואת המסלול. ההבדל הוא רק בצורת המסלול: ישר או מעגל. לכל דוגמה שרטוט של המסלול. כולל מילון מושגים מקביל, סימולציה של אחוז אחד שמניע את שתי התנועות, וארבעה זוגות של דוגמאות פתורות זו לצד זו: אחוז פשוט, מרכז כללי וכיוון הפוך, יותר מ־100% (מחזוריות), והבעיה ההפוכה (מתי?)." },

    { no:"04", href:"trigonometry-04-linear-vs-wheel-exercises.html", t:"תרגול: תנועה לינארית ותנועה על גלגל", q:"8 שאלות",

    { no:"05", href:"trigonometry-05-wheel-homework.html", t:"עבודת בית: נקודה על גלגל מסתובב", q:"12 שאלות", homework:true,

    { no:"06", href:"trigonometry-06-radians.html", t:"מעלות ורדיאנים, וערכי sin ו־cos של הזוויות החשובות", q:"12 שאלות",

/* ---------- views ---------- */
const SITE = 'מתמטיקה יא׳';
const HW_ID = 'homework';
const view = document.getElementById('view');
const qInput = document.getElementById('q');
const clearBtn = document.getElementById('clear');
const byId = Object.fromEntries(TOPICS.map(t => [t.id, t]));
// order used for the previous/next links: the homework list sits after the glossary
const CHAIN = TOPICS.map(t => t.id);
CHAIN.splice(CHAIN.indexOf('glossary') + 1, 0, HW_ID);

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const homeworkItems = () => TOPICS.flatMap(t => t.items.filter(i => i.homework).map(i => ({...i, topic: t})));
const qCount = q => { const m = q.match(/(\d+)\s*שאלות/); return m ? +m[1] : 0; };
function hwCount(){ const h = homeworkItems(); return `${h.length} עבודות · ${h.reduce((s, i) => s + qCount(i.q), 0)} שאלות`; }
const HW_TOPIC = () => ({ id: HW_ID, title: 'עבודות בית', count: hwCount(),
  desc: 'רשימה מרוכזת של כל עבודות הבית וההגשה באתר, לפי נושא.',
  lead: 'כל עבודות הבית וההגשה שבאתר במקום אחד, מסודרות לפי נושא. כל עבודה מופיעה גם ברשימה של הנושא שלה.' });
const titleOf = id => id === HW_ID ? 'עבודות בית' : byId[id].title;

/* ---------- search: ignore niqqud, geresh/gershayim/quotes, maqaf and case ---------- */
function norm(s){
  let out = '', map = [];
  for (let i = 0; i < s.length; i++){
    let c = s[i];
    if (c === '\u05BE' || c === '-') c = ' ';
    else if (/[\u0591-\u05C7'"\u05F3\u05F4`\u2018\u2019\u201C\u201D]/.test(c)) continue;
    out += c.toLowerCase(); map.push(i);
  }
  return { out, map };
}
const terms = q => norm(q).out.split(/\s+/).filter(Boolean);
const plain = html => html.replace(/<span class="m">[\s\S]*?<\/span>/g, ' ');
function matches(item, topic, ts){
  const hay = norm(item.t + ' ' + plain(item.d) + ' ' + topic.title + (item.homework ? ' עבודת בית' : '')).out;
  return ts.every(t => hay.includes(t));
}
// highlight the terms in a plain-text string (returns escaped HTML)
function hl(text, ts){
  if (!ts.length) return esc(text);
  const { out, map } = norm(text), r = [];
  for (const t of ts){ let p = out.indexOf(t); while (p !== -1){ r.push([map[p], map[p + t.length - 1] + 1]); p = out.indexOf(t, p + 1); } }
  if (!r.length) return esc(text);
  r.sort((a, b) => a[0] - b[0]);
  const m = [r[0]]; for (const x of r.slice(1)){ const l = m[m.length - 1]; if (x[0] <= l[1]) l[1] = Math.max(l[1], x[1]); else m.push(x); }
  let html = '', at = 0;
  for (const [a, b] of m){ html += esc(text.slice(at, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; at = b; }
  return html + esc(text.slice(at));
}
// description: highlight only the text, keep the math spans as they are
const hlDesc = (d, ts) => d.split(/(<span class="m">[\s\S]*?<\/span>)/).map((p, k) => k % 2 ? p : hl(p, ts)).join('');

/* ---------- rendering ---------- */
function itemHTML(i, ts = [], no = i.no){
  const ext = /\.pdf$/i.test(i.href) ? ' target="_blank" rel="noopener"' : '';
  const tag = i.homework ? '<span class="hwtag">עבודת בית</span>' : '';
  return `<li><a href="${esc(i.href)}"${ext}><span class="no">${no}</span><span class="t">${hl(i.t, ts)}${tag}</span><span class="q">${esc(i.q)}</span><span class="d">${hlDesc(i.d, ts)}</span></a></li>`;
}
const header = (title, lead, count) => `<header>
  <span class="eyebrow">אתר לימוד · מתמטיקה · כיתה יא׳ · 5 יחידות לימוד</span>
  <h1>${title}</h1>${lead ? `\n  <p class="lead">${lead}</p>` : ''}${count ? `\n  <span class="count">${count}</span>` : ''}
</header>`;
function topicNav(id){
  const k = CHAIN.indexOf(id), p = CHAIN[k - 1], n = CHAIN[k + 1];
  return `<nav class="topicnav" aria-label="נושאים סמוכים">${p ? `<a href="#${p}" rel="prev">→ ${titleOf(p)}</a>` : '<span></span>'}${n ? `<a href="#${n}" rel="next">${titleOf(n)} ←</a>` : ''}</nav>`;
}
const card = t => `<li><a href="#${t.id}"><span class="tt">${t.title}</span><span class="tc">${t.count}</span><span class="td">${t.desc}</span><span class="go">${t.id === HW_ID ? 'לרשימת העבודות' : 'לדפי הנושא'} ←</span></a></li>`;

function renderHome(){
  const cards = CHAIN.map(id => card(id === HW_ID ? HW_TOPIC() : byId[id])).join('\n');
  return header('מתמטיקה לכיתה יא׳', 'אוסף דפי לימוד ותרגול במתמטיקה לתלמידי כיתה יא׳ ברמת 5 יחידות, לפי תוכנית הלימודים בישראל. כל דף מסביר נושא אחד לעומק: מה המשמעות שלו, הנוסחאות ומאיפה הן באות, דרכי פתרון וטעויות נפוצות. אחרי ההסבר יש שאלות תרגול מדורגות עם פתרונות מלאים.') + `
<div class="about">
  <div><h3>מבנה כל דף</h3><p>הסבר ונוסחאות, ואחריו שאלות בשלוש רמות: בסיס, ביסוס ורמת בגרות.</p></div>
  <div><h3>איך לתרגל</h3><p>הפתרונות מוסתרים. פתרו קודם לבד, ואז לחצו על "הצג פתרון" כדי לבדוק את הדרך ואת התשובה.</p></div>
  <div><h3>סדר מומלץ</h3><p>בכל נושא כדאי ללמוד את הדפים לפי המספור, כי כל דף נשען על הקודמים.</p></div>
  <div><h3>חיפוש</h3><p>בשורת החיפוש למעלה אפשר לחפש מילה בכותרות ובתיאורים של כל הדפים, מכל הנושאים.</p></div>
</div>
<nav aria-label="נושאים"><ul class="topics">
${cards}
</ul></nav>`;
}
function renderTopic(t){
  return `<a class="back" href="#">→ לכל הנושאים</a>
${header(t.title, t.lead, t.count)}
<section class="topic" id="list-${t.id}"><ul class="docs">
${t.items.map(i => itemHTML(i)).join('\n')}
</ul></section>
${topicNav(t.id)}`;
}
function renderHomework(){
  const h = HW_TOPIC(); let n = 0;
  const groups = TOPICS.filter(t => t.items.some(i => i.homework)).map(t => `<section class="group hwlist">
  <h2>${t.title} <a href="#${t.id}">לדף הנושא ←</a></h2>
  <ul class="docs">
${t.items.filter(i => i.homework).map(i => itemHTML(i, [], String(++n).padStart(2, '0'))).join('\n')}
  </ul>
</section>`).join('\n');
  return `<a class="back" href="#">→ לכל הנושאים</a>
${header(h.title, h.lead, h.count)}
<p class="note">עבודות הבית מתפרסמות בלי פתרונות. כתבו את דרך הפתרון המלאה ולא רק את התשובה. כל העבודות מותאמות להדפסה.</p>
${groups}
${topicNav(HW_ID)}`;
}
function renderSearch(q){
  const ts = terms(q);
  let total = 0;
  const groups = TOPICS.map(t => {
    const hits = t.items.filter(i => matches(i, t, ts));
    total += hits.length;
    return hits.length ? `<section class="group">
  <h2>${t.title} <a href="#${t.id}">לדף הנושא ←</a></h2>
  <ul class="docs">
${hits.map(i => itemHTML(i, ts)).join('\n')}
  </ul>
</section>` : '';
  }).join('\n');
  const summary = total ? `נמצאו ${total} דפים עבור "${esc(q.trim())}"` : `לא נמצאו דפים עבור "${esc(q.trim())}". נסו מילה אחרת או חלק ממילה.`;
  return `<a class="back" href="#">→ לכל הנושאים</a>
${header('תוצאות חיפוש', '', '')}
<p class="note" role="status">${summary}</p>
${groups}`;
}

/* ---------- routing by the URL hash ---------- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('q=')) return { kind: 'search', q: h.slice(2) };
  if (h === HW_ID) return { kind: 'homework' };
  if (byId[h]) return { kind: 'topic', id: h };
  return { kind: 'home' };
}
let lastNonSearch = '';
function typeset(){ if (window.renderMathInElement) renderMathInElement(view, {delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}], throwOnError:false}); }
function render(scroll){
  const r = route();
  if (r.kind === 'search' && !r.q.trim()){ history.replaceState(null, '', lastNonSearch || location.pathname); return render(scroll); }
  if (r.kind !== 'search'){ lastNonSearch = location.hash || ''; if (document.activeElement !== qInput) qInput.value = ''; }
  else if (qInput.value !== r.q) qInput.value = r.q;
  clearBtn.hidden = !qInput.value;
  view.innerHTML = r.kind === 'search' ? renderSearch(r.q) : r.kind === 'homework' ? renderHomework() : r.kind === 'topic' ? renderTopic(byId[r.id]) : renderHome();
  document.title = (r.kind === 'home' ? 'מתמטיקה יא׳ · 5 יחידות' : r.kind === 'search' ? `חיפוש: ${r.q.trim()} · ${SITE}` : `${titleOf(r.kind === 'homework' ? HW_ID : r.id)} · ${SITE}`);
  typeset();
  if (scroll) window.scrollTo(0, 0);
}
qInput.addEventListener('input', () => {
  const v = qInput.value;
  const inSearch = route().kind === 'search';
  if (v.trim()){
    const url = '#q=' + encodeURIComponent(v);
    inSearch ? history.replaceState(null, '', url) : history.pushState(null, '', url);
  } else {
    history.replaceState(null, '', lastNonSearch || location.pathname);
  }
  render(false);
});
qInput.addEventListener('keydown', e => { if (e.key === 'Escape'){ qInput.value = ''; qInput.dispatchEvent(new Event('input')); } });
clearBtn.addEventListener('click', () => { qInput.value = ''; qInput.dispatchEvent(new Event('input')); qInput.focus(); });
window.addEventListener('hashchange', () => render(true));
window.addEventListener('popstate', () => render(true));
render(false);
</script>
